<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a0c; --card:#141418; --line:#24242c; --ink:#ececf1; --muted:#9a9aa8; --chip:#1b1b21; --accent-text:var(--accent);
  --accent:#818cf8; --accent-rgb:129,140,248;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme: dark; box-sizing: border-box;
  padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"] { --bg:#f3f3f7; --card:#ffffff; --line:#e0e0e8; --ink:#16161d; --muted:#5d5d6e; --chip:#eeeef4; --accent-text:color-mix(in srgb, var(--accent) 60%, #000); color-scheme:light; }
:root[data-theme="light"] .badge:not(.off) { color:#047857; background:rgba(16,185,129,.12); }
:root[data-theme="light"] dialog { box-shadow:0 30px 80px rgba(20,20,40,.25), 0 0 60px -20px rgba(var(--accent-rgb),.4); }
html { scroll-padding-top: env(safe-area-inset-top,0px); background:var(--bg); }
.topbar { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1rem; }
.mark { font-family:var(--display); font-weight:800; font-size:1.15rem; letter-spacing:-.01em; }
.theme-btn { font:inherit; font-weight:600; font-size:.9rem; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:.45rem 1rem; cursor:pointer; transition:border-color .2s; }
.theme-btn:hover { border-color:var(--accent); }
*,*::before,*::after { box-sizing: inherit; }
body { margin:0; background:var(--bg); color:var(--ink); font:400 1rem/1.6 var(--body); }
body::before { content:""; position:fixed; inset:0; pointer-events:none;
  background: radial-gradient(60rem 30rem at 15% -10%, rgba(var(--accent-rgb),.13), transparent 60%); }
a { color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:8px; }
.wrap { position:relative; width:min(100% - 2rem, 72rem); margin-inline:auto; padding-block:2rem 3rem; }

.bento { display:grid; gap:1rem; grid-template-columns:repeat(4,1fr); grid-auto-rows:minmax(11rem,auto); grid-auto-flow:dense; }
.card { position:relative; background:var(--card); border:1px solid var(--line); border-radius:22px; padding:1.4rem;
  display:flex; flex-direction:column; gap:.75rem; min-width:0;
  transition:transform .25s, border-color .25s, box-shadow .25s, opacity .25s; }
.card:hover { transform:translateY(-4px); border-color:rgba(var(--accent-rgb),.55); box-shadow:0 12px 40px -12px rgba(var(--accent-rgb),.4); }
.w2 { grid-column:span 2; } .w3 { grid-column:span 3; } .h2 { grid-row:span 2; }
h1,h2,h3 { font-family:var(--display); margin:0; letter-spacing:-.02em; line-height:1.05; }
.label { margin:0; font-size:.85rem; color:var(--muted); font-weight:500; }
p { margin:0; }

.hero { justify-content:space-between; padding:1.8rem; }
.badge { align-self:flex-start; display:inline-flex; align-items:center; gap:.55rem; font-size:.88rem; font-weight:600;
  padding:.3rem .8rem; border-radius:999px; background:rgba(52,211,153,.1); border:1px solid rgba(52,211,153,.35); color:#6ee7b7; }
.badge.off { background:rgba(154,154,168,.1); border-color:var(--line); color:var(--muted); }
.dot { width:.55rem; height:.55rem; border-radius:50%; background:currentColor; animation:pulse 2s infinite; }
@keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)} 100%{box-shadow:0 0 0 .6rem rgba(52,211,153,0)} }
.hero h1 { font-size:clamp(2.6rem,6vw,4.4rem); font-weight:800; }
.hero .role { font-family:var(--display); font-size:1.35rem; color:var(--accent-text); margin:.4rem 0 .9rem; }
.hero .bio { color:var(--muted); max-width:30rem; }
.hero-main { display:flex; align-items:center; justify-content:space-between; gap:1.5rem; }
.hero-main > div:first-child { min-width:0; }
.avatar { flex:none; width:clamp(7rem,14vw,10.5rem); aspect-ratio:1; border-radius:50%; overflow:hidden; display:grid; place-items:center; background:var(--chip); border:2px solid rgba(var(--accent-rgb),.6); box-shadow:0 0 40px -8px rgba(var(--accent-rgb),.6); font-family:var(--display); font-weight:800; font-size:clamp(2rem,4vw,3rem); color:var(--accent); }
.avatar img { width:100%; height:100%; object-fit:cover; display:block; }
.socials { display:flex; flex-wrap:wrap; gap:.6rem; }
.pill-link { text-decoration:none; font-weight:600; font-size:.92rem; padding:.5rem 1rem; border-radius:12px; border:1px solid var(--line); background:var(--chip); transition:border-color .2s, background .2s; }
.pill-link:hover { border-color:var(--accent); background:rgba(var(--accent-rgb),.12); }

.clock .time { font-family:var(--display); font-weight:700; font-size:clamp(1.9rem,3.4vw,2.5rem); font-variant-numeric:tabular-nums; margin-top:auto; }
.clock .meta { color:var(--muted); font-size:.92rem; }
.build .bar { height:6px; border-radius:6px; background:var(--line); overflow:hidden; margin-top:auto; }
.build .bar span { display:block; height:100%; background:var(--accent); border-radius:6px; }
.build h3 { font-size:1.35rem; }
.build p.note { color:var(--muted); font-size:.95rem; }

.stack-head { display:flex; justify-content:space-between; align-items:center; gap:1rem; }
.reset { font:inherit; font-size:.85rem; font-weight:600; color:var(--accent-text); background:none; border:1px solid var(--line); border-radius:999px; padding:.2rem .8rem; cursor:pointer; visibility:hidden; }
.reset.show { visibility:visible; }
.chips { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:auto; }
.chip { font:inherit; font-size:.92rem; color:var(--ink); background:var(--chip); border:1px solid var(--line); border-radius:999px; padding:.3rem .9rem; cursor:pointer; transition:all .2s; }
.chip:hover { border-color:var(--accent); }
.chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#0a0a0c; font-weight:600; }

.project { cursor:pointer; text-align:left; font:inherit; color:inherit; width:100%; }
.project h3 { font-size:1.45rem; }
.project.featured h3 { font-size:1.9rem; }
.project .sum { color:var(--muted); }
.tags { display:flex; flex-wrap:wrap; gap:.4rem; }
.project .tags { margin-top:auto; }
.tag { font-size:.8rem; padding:.15rem .65rem; border-radius:999px; background:rgba(var(--accent-rgb),.12); color:var(--accent-text); }
.star { align-self:flex-start; font-size:.85rem; font-weight:600; color:var(--accent-text); }
.card.match { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 12px 44px -10px rgba(var(--accent-rgb),.55); }
.card.dim { opacity:.35; }

.accents .swatches { display:flex; gap:.6rem; margin-top:auto; }
.sw { width:2.1rem; height:2.1rem; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; }
.sw[aria-pressed="true"] { border-color:var(--ink); }
.contact { justify-content:center; }
.contact h2 { font-size:clamp(1.6rem,3.4vw,2.4rem); }

.certstat .num { font-family:var(--display); font-weight:800; font-size:clamp(3.4rem,6vw,4.6rem); line-height:1; color:var(--accent-text); margin-top:auto; }
.certstat .sum { color:var(--muted); font-size:.95rem; }
.cert { overflow:hidden; }
.cert::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(115deg, transparent 40%, rgba(var(--accent-rgb),.16) 50%, transparent 60%); transform:translateX(-100%); transition:transform .7s; }
.cert:hover::after { transform:translateX(100%); }
.cert-top { display:flex; justify-content:space-between; align-items:flex-start; gap:.5rem; }
.cert .date { font-size:.82rem; font-weight:600; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:.1rem .65rem; }
.seal { width:3.2rem; height:3.2rem; border-radius:50%; padding:2px; display:grid; place-items:center; background:conic-gradient(var(--accent), rgba(var(--accent-rgb),.15), var(--accent)); transition:box-shadow .3s; }
.cert:hover .seal { box-shadow:0 0 24px rgba(var(--accent-rgb),.6); }
.seal span { display:grid; place-items:center; width:100%; height:100%; border-radius:50%; background:var(--card); font-family:var(--display); font-weight:800; font-size:1rem; color:var(--accent-text); }
.cert h3 { font-size:1.2rem; }
.cert .issuer { color:var(--muted); font-size:.95rem; }
.cert .meta { color:var(--muted); font-size:.82rem; }
.cert .verify { margin-top:auto; font-weight:600; font-size:.92rem; color:var(--accent-text); text-decoration:none; }
.cert .verify:hover { text-decoration:underline; }
dialog { width:min(92vw,36rem); max-height:88vh; overflow:auto; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:22px; padding:1.8rem; box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 60px -20px rgba(var(--accent-rgb),.5); }
dialog::backdrop { background:rgba(5,5,8,.72); backdrop-filter:blur(4px); }
dialog[open] { animation:pop .22s ease-out; }
@keyframes pop { from{opacity:0; transform:translateY(12px) scale(.98)} }
dialog h2 { font-size:2rem; margin:0 2rem .6rem 0; }
dialog .detail { color:var(--muted); margin:.8rem 0 1.2rem; }
.close { position:absolute; top:.9rem; right:.9rem; width:2.2rem; height:2.2rem; border-radius:50%; border:1px solid var(--line); background:var(--chip); color:var(--ink); font-size:1.1rem; cursor:pointer; }
.modal-links { display:flex; flex-wrap:wrap; gap:.6rem; margin-top:1.4rem; }
.modal-links .primary { background:var(--accent); color:#0a0a0c; border-color:var(--accent); }
footer { text-align:center; color:var(--muted); font-size:.88rem; margin-top:1.5rem; }
#footer { margin:0; }
.foot-socials { display:flex; justify-content:center; flex-wrap:wrap; gap:.6rem; margin-bottom:1rem; }
.social-btn { display:inline-flex; align-items:center; gap:.5rem; text-decoration:none; color:var(--ink); font-weight:600; font-size:.9rem; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:.5rem 1rem; transition:transform .2s, border-color .2s, box-shadow .2s, color .2s; }
.social-btn svg { width:1.1rem; height:1.1rem; fill:currentColor; }
.social-btn:hover { transform:translateY(-2px); border-color:var(--accent); color:var(--accent-text); box-shadow:0 8px 24px -10px rgba(var(--accent-rgb),.6); }
.work { background-image:linear-gradient(135deg, rgba(var(--accent-rgb),.12), transparent 55%); }
.work .sum { color:var(--muted); }
.work ul { margin:0; padding-left:1.1rem; color:var(--muted); font-size:.95rem; }
.work li { margin:.15rem 0; }

@media (max-width:62rem) {
  .bento { grid-template-columns:repeat(2,1fr); }
  .w3 { grid-column:span 1; }
}
@media (max-width:36rem) {
  .bento { grid-template-columns:1fr; grid-auto-rows:auto; }
  .w2,.w3 { grid-column:span 1; } .h2 { grid-row:span 1; }
  .card { min-height:9rem; }
  .hero-main { flex-direction:column-reverse; align-items:flex-start; }
}
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><span class="mark" id="mark"></span><button class="theme-btn" id="themeBtn" type="button"></button></div>
  <main class="bento" id="bento"></main>
  <footer><div class="foot-socials" id="footSocials"></div><p id="footer"></p></footer>
</div>
<dialog id="modal" aria-labelledby="mTitle"></dialog>

<script>
/* ==================================================================
   EDIT ONLY THIS OBJECT. The whole page is built from it.
   - Add a project: copy one { ... } block in `projects`, paste it
     after the last one (comma between), and edit the fields.
   - featured: true makes a project card wide (2 columns).
   - Leave live/repo as "" to hide that button.
   - Clicking a skill in the Tech Stack card highlights every project
     whose `tech` list contains the same word (match the spelling).
   ================================================================== */
const portfolioData = {
  name: "Raja Daniyal Kiyani",
  role: "Full-Stack Developer & AI Engineer",
  location: "Rawalpindi, Pakistan",
  timezone: "Asia/Karachi",
  availableForWork: true,
  statusText: "Available for work",
  bio: "I build fast web apps and AI-powered tools from database to interface. I enjoy turning messy problems into simple, reliable products.",
  email: "rajadaniyal.com",
  github: "https://github.com/rajadaniyalkiyani",
  linkedin: "https://linkedin.com/in/rajadaniyal",
  contact:"https://docs.google.com/forms/d/e/1FAIpQLScjjzzAcbN_JK4IRnNChtlF_Im1sh6Jos7RFVrnea3tMZhYuA/viewform?usp=publish-editor"
  avatar: "", // path to your photo, e.g. "me.jpg" (upload it next to index.html). Empty shows your initials.

  building: {
    title: "RAG assistant for support teams",
    note: "Learning vector search and evaluation while shipping a retrieval pipeline.",
    progress: 65 // percent
  },

  skills: ["JavaScript", "TypeScript", "Python", "React", "Node.js", "PostgreSQL", "Docker", "LLMs"],

  accents: [
    { name: "Indigo",  color: "#818cf8" },
    { name: "Emerald", color: "#34d399" },
    { name: "Amber",   color: "#fbbf24" },
    { name: "Rose",    color: "#fb7185" }
  ],

  /* Footer social links. To add one: copy a line, paste it, change label and url.
     icon can be "instagram", "x" or "youtube" (any other value shows just the label).
     An empty url hides the link, so you can leave a spot ready for later. */
  footerSocials: [
    { label: "Instagram", icon: "instagram", url: "https://instagram.com/yourname" },
    { label: "X", icon: "x", url: "https://x.com/yourname" },
    { label: "YouTube", icon: "youtube", url: "https://youtube.com/@yourname" },
    { label: "TikTok", icon: "", url: "" } // empty url = hidden until you fill it in
  ],

  /* Community & recognition (programs, speaking, mentoring, volunteering).
     Add one: copy a { ... } block, paste it after the last (comma between), edit it.
     badge is the short text inside the round seal (optional). */
  community: [
    {
      title: "AWS Community Builder",
      org: "Amazon Web Services",
      badge: "AWS",
      period: "2025 – Present",
      description: "Replace this with one or two sentences about what you do in the program and who it helps.",
      highlights: ["Replace with an article, talk or event you are proud of", "Replace with another contribution", "Replace with a number or result if you have one"],
      skills: ["Docker"],
      url: "https://example.com/profile"
    },
    {
      title: "Developer Community Mentor",
      org: "Your Community Name",
      badge: "",
      period: "2023 – Present",
      description: "Another role, like organizing meetups, mentoring, open-source maintenance or teaching.",
      highlights: ["Replace with something specific you did", "Replace with another contribution"],
      skills: [],
      url: ""
    }
  ],

  /* Add a certification: copy one { ... } block, paste it after the last
     one (comma between) and edit. `skills` links it to the Tech Stack
     filter. Leave url/credentialId as "" to hide them. */
  certifications: [
    {
      title: "Certification One",
      issuer: "Issuer Name",
      date: "2025",
      credentialId: "ABC-123456",
      url: "https://example.com/verify/abc",
      skills: ["Python", "LLMs"]
    },
    {
      title: "Certification Two",
      issuer: "Another Issuer",
      date: "2024",
      credentialId: "",
      url: "https://example.com/verify/def",
      skills: ["Docker"]
    },
    {
      title: "Certification Three",
      issuer: "Third Academy",
      date: "2023",
      credentialId: "",
      url: "",
      skills: ["JavaScript"]
    }
  ],

  projects: [
    {
      title: "Project One",
      summary: "A short summary of what it does and who it helps.",
      details: "Write two or three sentences here: the problem, how you solved it, and the result. This text appears in the pop-up.",
      tech: ["React", "Node.js", "PostgreSQL"],
      live: "https://example.com",
      repo: "https://github.com/yourname/project-one",
      featured: true
    },
    {
      title: "Project Two",
      summary: "A second project with a one-line summary.",
      details: "More detail about Project Two: what you built, what was hard, and what you learned.",
      tech: ["Python", "LLMs"],
      live: "",
      repo: "https://github.com/yourname/project-two"
    },
    {
      title: "Project Three",
      summary: "A third project. Copy this block to add more.",
      details: "More detail about Project Three goes here.",
      tech: ["TypeScript", "Docker"],
      live: "https://example.com",
      repo: "https://github.com/yourname/project-three"
    }
  ]
};

/* ------------------ Rendering engine (no need to edit) ------------------ */
const d = portfolioData;
const bento = document.getElementById("bento");
const modal = document.getElementById("modal");

function el(tag, props = {}, kids = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "text") n.textContent = v;
    else if (k === "class") n.className = v;
    else n.setAttribute(k, v);
  }
  kids.forEach(c => n.appendChild(c));
  return n;
}
function link(href, text, cls = "pill-link") {
  const p = { href, text, class: cls };
  if (/^https?:/.test(href)) { p.target = "_blank"; p.rel = "noopener noreferrer"; }
  return el("a", p);
}
const card = (cls, kids) => el("section", { class: "card " + cls }, kids);

document.title = d.name + " – " + d.role;

/* Hero */
const socials = el("div", { class: "socials" });
if (d.github) socials.appendChild(link(d.github, "GitHub"));
if (d.linkedin) socials.appendChild(link(d.linkedin, "LinkedIn"));
if (d.email) socials.appendChild(link("mailto:" + d.email, "Email"));
function makeAvatar() {
  const box = el("div", { class: "avatar", role: "img", "aria-label": d.name });
  box.textContent = d.name.split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
  if (d.avatar) {
    const img = el("img", { src: d.avatar, alt: "" });
    img.addEventListener("load", () => box.replaceChildren(img));
  }
  return box;
}
bento.appendChild(card("hero w2 h2", [
  el("span", { class: "badge" + (d.availableForWork ? "" : " off") }, [el("span", { class: "dot" }), el("span", { text: d.statusText })]),
  el("div", { class: "hero-main" }, [
    el("div", {}, [el("h1", { text: d.name }), el("p", { class: "role", text: d.role }), el("p", { class: "bio", text: d.bio })]),
    makeAvatar()
  ]),
  socials
]));

/* Clock */
const timeEl = el("div", { class: "time" });
const dateEl = el("p", { class: "meta" });
bento.appendChild(card("clock", [el("p", { class: "label", text: "Local time" }), timeEl, el("div", {}, [el("p", { text: d.location }), dateEl])]));
function tick() {
  const now = new Date();
  timeEl.textContent = new Intl.DateTimeFormat("en-GB", { timeZone: d.timezone, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }).format(now);
  const zone = new Intl.DateTimeFormat("en", { timeZone: d.timezone, timeZoneName: "short" }).formatToParts(now).find(p => p.type === "timeZoneName");
  dateEl.textContent = new Intl.DateTimeFormat("en", { timeZone: d.timezone, weekday: "short", day: "numeric", month: "short" }).format(now) + " · " + (zone ? zone.value : d.timezone);
}
tick(); setInterval(tick, 1000);

/* Currently building */
const bar = el("div", { class: "bar", role: "progressbar", "aria-valuenow": d.building.progress, "aria-valuemin": 0, "aria-valuemax": 100 }, [el("span", { style: "width:" + d.building.progress + "%" })]);
bento.appendChild(card("build", [el("p", { class: "label", text: "Currently building" }), el("h3", { text: d.building.title }), el("p", { class: "note", text: d.building.note }), bar]));

/* Tech stack filter */
const projectCards = [];
let activeSkill = null;
const resetBtn = el("button", { class: "reset", type: "button", text: "Reset" });
const chipBox = el("div", { class: "chips" });
d.skills.forEach(s => {
  const b = el("button", { class: "chip", type: "button", "aria-pressed": "false", text: s });
  b.addEventListener("click", () => setFilter(activeSkill === s ? null : s));
  chipBox.appendChild(b);
});
resetBtn.addEventListener("click", () => setFilter(null));
function setFilter(skill) {
  activeSkill = skill;
  chipBox.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c.textContent === skill)));
  resetBtn.classList.toggle("show", !!skill);
  projectCards.forEach(({ node, p }) => {
    const hit = !!skill && p.tech.includes(skill);
    node.classList.toggle("match", hit);
    node.classList.toggle("dim", !!skill && !hit);
  });
}
bento.appendChild(card("stack w2", [
  el("div", { class: "stack-head" }, [el("p", { class: "label", text: "Tech stack: click a skill to highlight related work" }), resetBtn]),
  chipBox
]));

/* Projects */
function openModal(p) {
  modal.replaceChildren();
  const close = el("button", { class: "close", type: "button", "aria-label": "Close", text: "✕" });
  close.addEventListener("click", () => modal.close());
  const links = el("div", { class: "modal-links" });
  if (p.live) links.appendChild(link(p.live, "Live demo", "pill-link primary"));
  if (p.repo) links.appendChild(link(p.repo, "Source code", "pill-link"));
  modal.append(close,
    el("h2", { id: "mTitle", text: p.title }),
    el("div", { class: "tags" }, p.tech.map(t => el("span", { class: "tag", text: t }))),
    el("p", { class: "detail", text: p.details || p.summary }),
    links);
  modal.showModal();
}
modal.addEventListener("click", e => { if (e.target === modal) modal.close(); });

d.projects.forEach(p => {
  const node = el("button", { class: "card project" + (p.featured ? " featured w2" : ""), type: "button", "aria-haspopup": "dialog" }, [
    p.featured ? el("span", { class: "star", text: "★ Featured project" }) : el("span", { class: "label", text: "Project" }),
    el("h3", { text: p.title }),
    el("p", { class: "sum", text: p.summary }),
    el("div", { class: "tags" }, p.tech.map(t => el("span", { class: "tag", text: t })))
  ]);
  node.addEventListener("click", () => openModal(p));
  bento.appendChild(node);
  projectCards.push({ node, p });
});

/* Certifications */
const certs = d.certifications || [];
if (certs.length) {
  const issuers = [...new Set(certs.map(c => c.issuer))];
  bento.appendChild(card("certstat", [
    el("p", { class: "label", text: "Certifications" }),
    el("div", { class: "num", text: String(certs.length) }),
    el("p", { class: "sum", text: "Credentials from " + issuers.slice(0, 3).join(", ") + (issuers.length > 3 ? " and more" : "") + "." })
  ]));
  certs.forEach(c => {
    const initials = c.issuer.split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
    const kids = [
      el("div", { class: "cert-top" }, [el("div", { class: "seal" }, [el("span", { text: initials })]), el("span", { class: "date", text: c.date })]),
      el("h3", { text: c.title }),
      el("p", { class: "issuer", text: c.issuer })
    ];
    if (c.credentialId) kids.push(el("p", { class: "meta", text: "ID: " + c.credentialId }));
    if ((c.skills || []).length) kids.push(el("div", { class: "tags" }, c.skills.map(t => el("span", { class: "tag", text: t }))));
    const node = card("cert", kids);
    if (c.url) node.appendChild(link(c.url, "Verify credential", "verify"));
    bento.appendChild(node);
    projectCards.push({ node, p: { tech: c.skills || [] } });
  });
}

/* Community & recognition */
(d.community || []).forEach(w => {
  const seal = el("div", { class: "seal" }, [el("span", { text: w.badge || w.org.split(/\s+/).map(x => x[0]).slice(0, 2).join("").toUpperCase() })]);
  const kids = [
    el("div", { class: "cert-top" }, [seal, el("span", { class: "date", text: w.period })]),
    el("p", { class: "label", text: "Community & recognition" }),
    el("h3", { text: w.title }),
    el("p", { class: "issuer", text: w.org })
  ];
  if (w.description) kids.push(el("p", { class: "sum", text: w.description }));
  if ((w.highlights || []).length) kids.push(el("ul", {}, w.highlights.map(h => el("li", { text: h }))));
  if ((w.skills || []).length) kids.push(el("div", { class: "tags" }, w.skills.map(t => el("span", { class: "tag", text: t }))));
  const node = card("cert work w2", kids);
  if (w.url) node.appendChild(link(w.url, "View profile", "verify"));
  bento.appendChild(node);
  projectCards.push({ node, p: { tech: w.skills || [] } });
});

/* Accent switcher */
const sw = el("div", { class: "swatches" });
function applyAccent(a) {
  const h = a.color.replace("#", "");
  const rgb = [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)).join(",");
  document.documentElement.style.setProperty("--accent", a.color);
  document.documentElement.style.setProperty("--accent-rgb", rgb);
  sw.querySelectorAll(".sw").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.c === a.color)));
  try { localStorage.setItem("accent", a.color); } catch (e) {}
}
d.accents.forEach(a => {
  const b = el("button", { class: "sw", type: "button", "aria-label": a.name + " accent", "aria-pressed": "false", style: "background:" + a.color });
  b.dataset.c = a.color;
  b.addEventListener("click", () => applyAccent(a));
  sw.appendChild(b);
});
bento.appendChild(card("accents", [el("p", { class: "label", text: "Accent color" }), sw]));

/* Contact */
bento.appendChild(card("contact w3", [el("h2", { text: "Have something in mind? Let’s build it." }), el("div", { class: "socials" }, [link("mailto:" + d.email, d.email)])]));

/* Day / night mode: follows the visitor’s system setting until they choose */
const root = document.documentElement;
const themeBtn = document.getElementById("themeBtn");
function setTheme(t, save) {
  root.dataset.theme = t;
  themeBtn.textContent = t === "dark" ? "☀ Day mode" : "☾ Night mode";
  themeBtn.setAttribute("aria-label", t === "dark" ? "Switch to day mode" : "Switch to night mode");
  if (save) { try { localStorage.setItem("theme", t); } catch (e) {} }
}
themeBtn.addEventListener("click", () => setTheme(root.dataset.theme === "dark" ? "light" : "dark", true));
let savedTheme = null;
try { savedTheme = localStorage.getItem("theme"); } catch (e) {}
setTheme(savedTheme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"), false);
document.getElementById("mark").textContent = d.name;

let saved = null;
try { saved = localStorage.getItem("accent"); } catch (e) {}
applyAccent(d.accents.find(a => a.color === saved) || d.accents[0]);

/* Footer social links */
const ICONS = {
  instagram: '<rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2"/>',
  x: '<path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>',
  youtube: '<rect x="2" y="5" width="20" height="14" rx="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 9l5.2 3-5.2 3z"/>'
};
const footSocials = document.getElementById("footSocials");
(d.footerSocials || []).filter(s => s.url).forEach(s => {
  const a = link(s.url, "", "social-btn");
  a.setAttribute("aria-label", s.label);
  if (ICONS[s.icon]) {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("aria-hidden", "true");
    svg.innerHTML = ICONS[s.icon];
    a.appendChild(svg);
  }
  a.appendChild(el("span", { text: s.label }));
  footSocials.appendChild(a);
});

document.getElementById("footer").textContent = "© " + new Date().getFullYear() + " " + d.name;
</script>
</body>
</html>
